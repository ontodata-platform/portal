# WP-09：SPA 静态托管（nginx-unprivileged，非 root，监听 8080）
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：history 模式前端路由一律回落 index.html，由 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物带内容哈希，静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代不在本镜像内配置：生产环境由入口网关（Ingress / API Gateway）
    # 统一路由到各后端服务，前端镜像保持纯静态托管，避免镜像内固化上游地址。
    # 本地排障如需直连，可临时启用：
    # location /api/ { proxy_pass http://portal-server:18085/; }
}
