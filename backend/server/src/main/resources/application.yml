spring:
  application:
    name: ontodata-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/portal?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  # WP-03 任务投影消费：bootstrap 走环境变量 KAFKA_BOOTSTRAP_SERVERS（默认本地）
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # WP-02 身份底座：安全模式（默认）下必须配置 issuer-uri 指向 IdP 的 OIDC issuer
  #（据此拉取 JWK 集验签），未配置则启动即失败（拒绝半配置运行）。
  # 环境变量：IAM_ISSUER_URI；本地 Keycloak 示例：http://localhost:8180/realms/ontodata
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: ${IAM_ISSUER_URI:http://localhost:8180/realms/ontodata}

server:
  port: ${SERVER_PORT:18085}

ontodata:
  security:
    oauth2:
      # WP-02 身份底座：缺省 true=安全模式（OIDC Bearer JWT，resource server），租户/组织/项目/密级
      # 从已验证令牌 claim 映射（ClaimContextFilter），显式 X-Tenant-Id 等请求头不作为事实来源；
      # 必须同时配置 spring.security.oauth2.resourceserver.jwt.issuer-uri（见上方注释块），
      # 未配置则启动即失败。仅本地无 IdP 开发/演示可显式 IAM_ENABLED=false 退回显式头模式
      #（全部请求匿名放行，启动日志有 WARN 提示，严禁用于生产）。
      enabled: ${IAM_ENABLED:true}
  events:
    # S2 收敛：SDK 信封 producer 标识（必填，缺失拒绝记事件）
    producer: portal
    kafka:
      # WP-03 事件驱动的任务投影：缺省 true=订阅六个域主题构建任务投影（消费组
      # portal.task-projection，DLQ <topic>.dlq，ADR-006）；显式 false 关闭消费装配
      #（未部署总线的环境与测试使用）。
      # WP-07 起同一开关同时控制 Outbox → Kafka 发布器（portal.approval.decided 等
      # 门户生产事件投递 ontodata.portal.approval.v1）；关闭时事件留在 outbox_event 表，
      # 主流程不受影响，恢复后自动补投。
      enabled: ${KAFKA_EVENTS_ENABLED:true}
    outbox:
      # WP-07 Outbox 发布器轮询参数（毫秒）：投递间隔与首次启动延迟
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
      initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:10000}
  retention:
    # 数据保留（M5）：超过保留期的终态记录可清理（dryRun 先演练），默认 180 天
    days: ${RETENTION_DAYS:180}

management:
  endpoints:
    web:
      exposure:
        # WP-09 可观测性：新增 prometheus 指标端点（仅集群内抓取，网络层收敛，不对公网暴露）
        include: health,info,prometheus
  metrics:
    tags:
      # 通用维度：Prometheus 告警/看板按 application 标签区分五个后端
      application: ${spring.application.name}
