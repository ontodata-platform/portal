spring:
  application:
    name: ontodata-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/portal?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:18085}

ontodata:
  security:
    oauth2:
      # M5 IAM：true 时启用 OIDC Bearer JWT 认证（resource server），租户/组织/项目/密级
      # 从令牌 claim 映射（此时显式 X-Tenant-Id 等请求头被忽略）；缺省 false=显式头模式
      #（开发/演示）。启用必须同时配置 spring.security.oauth2.resourceserver.jwt.issuer-uri。
      enabled: ${IAM_ENABLED:false}
  retention:
    # 数据保留（M5）：超过保留期的终态记录可清理（dryRun 先演练），默认 180 天
    days: ${RETENTION_DAYS:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info
