spring:
  datasource:
    url: jdbc:h2:mem:portal_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

ontodata:
  security:
    oauth2:
      # WP-02 起缺省即安全模式（true）；既有非安全主题测试仍走显式头模式，
      # 这里显式关闭以保持其语义不变（安全路径由 PortalIamIntegrationTest 等
      # 逐类用 TestPropertySource 显式 enabled=true 覆盖）
      enabled: false
